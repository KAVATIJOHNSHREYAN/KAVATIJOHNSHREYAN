name: F.R.I.D.A.Y. AI Assistant Bot

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  friday-reply:
    if: contains(github.event.issue.title, 'Ask FRIDAY') || contains(github.event.issue.labels.*.name, 'ask-friday') || contains(github.event.issue.body, 'FRIDAY')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: 🤖 Execute F.R.I.D.A.Y. AI Response Protocol
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/friday_bot.py
